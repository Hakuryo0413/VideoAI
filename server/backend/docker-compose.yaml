version: '3.7'

services:
  db:
    image: postgres:15.0
    volumes:
      - ./docker/db:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf
    expose:
      - 5432
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    restart: unless-stopped
    # networks:
    #   - videoai-network

  alembic:
    image: videoai-backend:latest
    environment:
      SQL_DATABASE_URL: 'postgresql+psycopg2://postgres:postgres@db:5432/postgres'
      SECRET_KEY: ${SECRET_KEY}
    command: [ "alembic", "upgrade", "head" ]
    depends_on:
      - db
    # networks:
    #   - videoai-network

  app:
    image: videoai-backend:latest
    environment:
      PROJECT_NAME: ${PROJECT_NAME}
      SQL_DATABASE_URL: 'postgresql+psycopg2://postgres:postgres@db:5432/postgres'
      SECRET_KEY: ${SECRET_KEY}
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - db
      - alembic
    volumes:
      - ../scraper:/opt/airflow/scraper
      - ../video:/opt/airflow/video  
    # networks:
    #   - videoai-network

# networks:
#   videoai-network: